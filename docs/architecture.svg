<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1400 800" width="1400" height="800" role="img">
	<title>mlsbond: components and where keys live</title>
	<desc>One mlsbond server, the Delivery Service, orders and relays the MLS messages of every VNI group and holds no secrets. On each host an mlsbond client is the host's member in every VNI group it subscribed to; it derives the Security Associations of each pair from the group's exporter and hands them, one step at a time, to the orchestrator, which installs them into the dataplane. Clients reach the server over one bidirectional gRPC stream each; an operator sets the rekey policy over the admin API. Key material only exists inside a host; between dataplanes it protects ESP.</desc>

	<style>
		svg {
			--ground: #eceff0;
			--surface: #ffffff;
			--panel: #f5f8f8;
			--ink: #131b1f;
			--ink-2: #4d5c62;
			--ink-3: #71838a;
			--rule: #c6d2d5;
			--out: #0f6f8c;
			--out-bg: #e6f2f6;
			--back: #8a5713;
			--back-bg: #f8f0e4;
			--ctl: #5a4bb0;
			--ctl-bg: #efedf9;
			--sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;
		}

		@media (prefers-color-scheme: dark) {
			svg {
				--ground: #0c1214;
				--surface: #151d20;
				--panel: #111a1c;
				--ink: #dde7e9;
				--ink-2: #a3b4b9;
				--ink-3: #7b8d93;
				--rule: #2a393d;
				--out: #5cc0dd;
				--out-bg: #10262e;
				--back: #e2b262;
				--back-bg: #2a2214;
				--ctl: #a99bf0;
				--ctl-bg: #1d1a33;
			}
		}

		.ground { fill: var(--ground); }
		.panel { fill: var(--panel); stroke: var(--rule); }
		.box { fill: var(--surface); stroke: var(--rule); }
		.box-dim { fill: var(--surface); stroke: var(--rule); stroke-dasharray: 4 3; }
		.box-ctl { fill: var(--surface); stroke: var(--ctl); stroke-width: 1.4; }
		.fill-ctl { fill: var(--ctl-bg); stroke: var(--ctl); stroke-width: 1.4; }
		.fill-out { fill: var(--out-bg); stroke: var(--out); stroke-width: 1.4; }
		.fill-back { fill: var(--back-bg); stroke: var(--back); stroke-width: 1.4; }

		.l-ctl { stroke: var(--ctl); stroke-width: 2; fill: none; }
		.l-veth { stroke: var(--ctl); stroke-width: 5; fill: none; stroke-linecap: round; }
		.l-out { stroke: var(--out); stroke-width: 2; fill: none; }
		.l-back { stroke: var(--back); stroke-width: 2; fill: none; }
		.l-ink { stroke: var(--ink-3); stroke-width: 1.3; fill: none; }
		.l-key { stroke: var(--ink-3); stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
		.mk-ink { fill: var(--ink-3); }
		.mk-ctl { fill: var(--ctl); }
		.mk-out { fill: var(--out); }
		.mk-back { fill: var(--back); }

		text { font-family: var(--sans); fill: var(--ink-2); font-size: 11px; white-space: pre; }
		.t-title { font-size: 23px; font-weight: 600; fill: var(--ink); }
		.t-sub { font-size: 12px; fill: var(--ink-2); }
		.t-sec { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; fill: var(--ink-3); }
		.t-h { font-size: 13px; font-weight: 600; fill: var(--ink); }
		.t-node { font-family: var(--mono); font-size: 12px; font-weight: 600; fill: var(--ink); }
		.t-m { font-family: var(--mono); font-size: 10.5px; fill: var(--ink-2); }
		.t-dim { fill: var(--ink-3); }
		.c-out { fill: var(--out); }
		.c-back { fill: var(--back); }
		.c-ctl { fill: var(--ctl); }
		.mid { text-anchor: middle; }
		.end { text-anchor: end; }
		.l-life { stroke: var(--rule); stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; }
		.l-ret { stroke: var(--ctl); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
		.l-ret-ink { stroke: var(--ink-3); stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
		.note { fill: var(--panel); stroke: var(--rule); }
		.bar-old-out { fill: var(--out-bg); stroke: var(--out); stroke-width: 1.2; stroke-dasharray: 4 3; }
		.bar-new-out { fill: var(--out); }
		.bar-old-back { fill: var(--back-bg); stroke: var(--back); stroke-width: 1.2; stroke-dasharray: 4 3; }
		.bar-new-back { fill: var(--back); }
		.t-inv { fill: var(--surface); }
	</style>

	<defs>
		<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L10 5 L0 10 z" class="mk-ink"/>
		</marker>
		<marker id="arr-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L10 5 L0 10 z" class="mk-ctl"/>
		</marker>
		<marker id="arr-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L10 5 L0 10 z" class="mk-out"/>
		</marker>
		<marker id="arr-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L10 5 L0 10 z" class="mk-back"/>
		</marker>
	</defs>

	<rect class="ground" x="0" y="0" width="1400" height="800"/>

	<text class="t-title" x="40" y="48">mlsbond: components and where keys live</text>
	<text class="t-sub" x="40" y="72">one server for the control network · one client and one orchestrator per host · Security Association keys never leave the host that derived them</text>

	<!-- legend -->
	<text class="t-sec" x="40" y="122">WHERE SECRETS LIVE</text>
	<text class="t-m" x="40" y="146">MLS group state, exporter     mlsbond client</text>
	<text class="t-m" x="40" y="164">Security Associations         client → orchestrator → dataplane</text>
	<text class="t-m" x="40" y="182">towards the server            MLS ciphertext and public keys only</text>
	<text class="t-m" x="40" y="200">between the dataplanes        ESP, AES-256-GCM</text>

	<!-- server -->
	<rect class="fill-ctl" x="470" y="100" width="460" height="170" rx="6"/>
	<text class="t-h" x="486" y="124">mlsbond-server</text>
	<rect class="box-dim" x="861" y="110" width="57" height="20" rx="10"/>
	<text class="t-m t-dim mid" x="889.5" y="124">no keys</text>
	<text class="t-m" x="486" y="148">Delivery :4712 · Admin :4713</text>
	<text class="t-m" x="486" y="165">per VNI group: members oldest first, the committer,</text>
	<text class="t-m" x="486" y="182">a numbered message log, pending joins, removals, rekeys</text>
	<text class="t-m" x="486" y="199">uploaded key packages · rekey policy · boot ID</text>
	<text class="t-m t-dim" x="486" y="216">relays MLS messages it cannot read</text>
	<text class="t-m t-dim" x="486" y="233">memory only: a restart regroups every VNI</text>

	<!-- operator -->
	<rect class="box" x="1060" y="130" width="300" height="84" rx="6"/>
	<text class="t-h" x="1076" y="154">operator</text>
	<text class="t-m" x="1076" y="176">Get / SetPolicy · SetVNIPolicy</text>
	<text class="t-m" x="1076" y="194">Rekey{vni} · ListGroups</text>
	<path class="l-ctl" d="M1060 172 H930" marker-end="url(#arr-ctl)"/>
	<text class="t-m c-ctl mid" x="995" y="164">Admin</text>
	<text class="t-m c-ctl end" x="440" y="294">Delivery.Stream</text>
	<text class="t-m t-dim end" x="440" y="310">one bidirectional gRPC stream</text>
	<text class="t-m c-ctl" x="960" y="294">key packages · commits · Welcome</text>
	<text class="t-m t-dim" x="960" y="310">Ready / Switched (MLS-encrypted) · acks</text>

	<!-- host a -->
	<rect class="panel" x="40" y="330" width="620" height="400" rx="8"/>
	<text class="t-sec" x="56" y="352">HOST A · HOST PREFIX fd00:a::/64</text>
	<rect class="box-ctl" x="60" y="370" width="580" height="120" rx="6"/>
	<text class="t-h" x="76" y="394">mlsbond-client</text>
	<rect class="fill-back" x="592" y="380" width="36" height="20" rx="10"/>
	<text class="t-m c-back mid" x="610.0" y="394">keys</text>
	<text class="t-m" x="76" y="416">ClientAPI [::1]:4714 · member of each subscribed VNI group</text>
	<text class="t-m" x="76" y="434">derives every pair's Security Associations from the exporter</text>
	<text class="t-m" x="76" y="452">paces each step on the peer's Ready / Switched</text>
	<text class="t-m t-dim" x="76" y="470">memory only: a restart rejoins and rekeys this host's pairs</text>
	<path class="l-ctl" d="M200 490 V540" marker-start="url(#arr-ctl)" marker-end="url(#arr-ctl)"/>
	<text class="t-m c-ctl" x="212" y="510">Init · Subscribe · Unsubscribe · DataplaneReset · Status</text>
	<text class="t-m t-dim" x="212" y="527">WatchSecurityAssociations: steps ↓ · inventory, confirmations ↑</text>
	<rect class="box" x="60" y="540" width="580" height="80" rx="6"/>
	<text class="t-h" x="76" y="564">orchestrator</text>
	<rect class="fill-back" x="592" y="550" width="36" height="20" rx="10"/>
	<text class="t-m c-back mid" x="610.0" y="564">keys</text>
	<text class="t-m" x="76" y="586">Go package mlsbond: Connect · Client{Add, Update, Remove} · Inventory</text>
	<text class="t-m t-dim" x="76" y="604">metalnet</text>
	<path class="l-ink" d="M200 620 V660" marker-end="url(#arr)"/>
	<text class="t-m" x="212" y="645">Create · Update · Delete Security Association</text>
	<rect class="box" x="60" y="660" width="580" height="54" rx="6"/>
	<text class="t-h" x="76" y="684">dataplane</text>
	<text class="t-m" x="76" y="703">dpservice, or the Linux kernel through XFRM (ADR 0015)</text>
	<rect class="fill-back" x="592" y="670" width="36" height="20" rx="10"/>
	<text class="t-m c-back mid" x="610.0" y="684">keys</text>

	<!-- host b -->
	<rect class="panel" x="740" y="330" width="620" height="400" rx="8"/>
	<text class="t-sec" x="756" y="352">HOST B · HOST PREFIX fd00:b::/64</text>
	<rect class="box-ctl" x="760" y="370" width="580" height="120" rx="6"/>
	<text class="t-h" x="776" y="394">mlsbond-client</text>
	<rect class="fill-back" x="1292" y="380" width="36" height="20" rx="10"/>
	<text class="t-m c-back mid" x="1310.0" y="394">keys</text>
	<text class="t-m" x="776" y="416">ClientAPI [::1]:4714 · member of each subscribed VNI group</text>
	<text class="t-m" x="776" y="434">derives every pair's Security Associations from the exporter</text>
	<text class="t-m" x="776" y="452">paces each step on the peer's Ready / Switched</text>
	<text class="t-m t-dim" x="776" y="470">memory only: a restart rejoins and rekeys this host's pairs</text>
	<path class="l-ctl" d="M900 490 V540" marker-start="url(#arr-ctl)" marker-end="url(#arr-ctl)"/>
	<text class="t-m c-ctl" x="912" y="510">Init · Subscribe · Unsubscribe · DataplaneReset · Status</text>
	<text class="t-m t-dim" x="912" y="527">WatchSecurityAssociations: steps ↓ · inventory, confirmations ↑</text>
	<rect class="box" x="760" y="540" width="580" height="80" rx="6"/>
	<text class="t-h" x="776" y="564">orchestrator</text>
	<rect class="fill-back" x="1292" y="550" width="36" height="20" rx="10"/>
	<text class="t-m c-back mid" x="1310.0" y="564">keys</text>
	<text class="t-m" x="776" y="586">Go package mlsbond: Connect · Client{Add, Update, Remove} · Inventory</text>
	<text class="t-m t-dim" x="776" y="604">metalnet</text>
	<path class="l-ink" d="M900 620 V660" marker-end="url(#arr)"/>
	<text class="t-m" x="912" y="645">Create · Update · Delete Security Association</text>
	<rect class="box" x="760" y="660" width="580" height="54" rx="6"/>
	<text class="t-h" x="776" y="684">dataplane</text>
	<text class="t-m" x="776" y="703">dpservice, or the Linux kernel through XFRM (ADR 0015)</text>
	<rect class="fill-back" x="1292" y="670" width="36" height="20" rx="10"/>
	<text class="t-m c-back mid" x="1310.0" y="684">keys</text>

	<!-- delivery streams -->
	<path class="l-ctl" d="M560 270 C560 312 330 312 330 370" marker-start="url(#arr-ctl)" marker-end="url(#arr-ctl)"/>
	<path class="l-ctl" d="M840 270 C840 312 1070 312 1070 370" marker-start="url(#arr-ctl)" marker-end="url(#arr-ctl)"/>

	<!-- ESP between the dataplanes -->
	<path class="l-out" d="M640 690 H760" marker-start="url(#arr-out)" marker-end="url(#arr-out)"/>
	<text class="t-m c-out mid" x="700" y="758">ESP between the dataplanes · one Security Association per VNI and direction · SPI picked by the receiving host</text>
	<text class="t-m t-dim mid" x="700" y="776">the delivery streams run on the control network; nothing on the fabric carries key material</text>
</svg>
