<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 1400 1010" width="1400" height="1010" role="img">
	<title>mlsbond: a host joins a VNI group</title>
	<desc>Sequence of a second host joining VNI 100: client B says Hello, uploads key packages and asks to join; the server collects pending changes for the commit delay and hands them to the committer, client A, as CommitWork; A answers with an MLS commit and a Welcome; the server appends the commit to the VNI group's log and sends it to every member, and the Welcome to B; members acknowledge and the server trims the log. The new pair A-B then sets up its Security Associations. Insets cover creating a group, a committer going away, and reliable delivery.</desc>

	<style>
		svg {
			--ground: #eceff0;
			--surface: #ffffff;
			--panel: #f5f8f8;
			--ink: #131b1f;
			--ink-2: #4d5c62;
			--ink-3: #71838a;
			--rule: #c6d2d5;
			--out: #0f6f8c;
			--out-bg: #e6f2f6;
			--back: #8a5713;
			--back-bg: #f8f0e4;
			--ctl: #5a4bb0;
			--ctl-bg: #efedf9;
			--sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			--mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "DejaVu Sans Mono", monospace;
		}

		@media (prefers-color-scheme: dark) {
			svg {
				--ground: #0c1214;
				--surface: #151d20;
				--panel: #111a1c;
				--ink: #dde7e9;
				--ink-2: #a3b4b9;
				--ink-3: #7b8d93;
				--rule: #2a393d;
				--out: #5cc0dd;
				--out-bg: #10262e;
				--back: #e2b262;
				--back-bg: #2a2214;
				--ctl: #a99bf0;
				--ctl-bg: #1d1a33;
			}
		}

		.ground { fill: var(--ground); }
		.panel { fill: var(--panel); stroke: var(--rule); }
		.box { fill: var(--surface); stroke: var(--rule); }
		.box-dim { fill: var(--surface); stroke: var(--rule); stroke-dasharray: 4 3; }
		.box-ctl { fill: var(--surface); stroke: var(--ctl); stroke-width: 1.4; }
		.fill-ctl { fill: var(--ctl-bg); stroke: var(--ctl); stroke-width: 1.4; }
		.fill-out { fill: var(--out-bg); stroke: var(--out); stroke-width: 1.4; }
		.fill-back { fill: var(--back-bg); stroke: var(--back); stroke-width: 1.4; }

		.l-ctl { stroke: var(--ctl); stroke-width: 2; fill: none; }
		.l-veth { stroke: var(--ctl); stroke-width: 5; fill: none; stroke-linecap: round; }
		.l-out { stroke: var(--out); stroke-width: 2; fill: none; }
		.l-back { stroke: var(--back); stroke-width: 2; fill: none; }
		.l-ink { stroke: var(--ink-3); stroke-width: 1.3; fill: none; }
		.l-key { stroke: var(--ink-3); stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
		.mk-ink { fill: var(--ink-3); }
		.mk-ctl { fill: var(--ctl); }
		.mk-out { fill: var(--out); }
		.mk-back { fill: var(--back); }

		text { font-family: var(--sans); fill: var(--ink-2); font-size: 11px; white-space: pre; }
		.t-title { font-size: 23px; font-weight: 600; fill: var(--ink); }
		.t-sub { font-size: 12px; fill: var(--ink-2); }
		.t-sec { font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em; fill: var(--ink-3); }
		.t-h { font-size: 13px; font-weight: 600; fill: var(--ink); }
		.t-node { font-family: var(--mono); font-size: 12px; font-weight: 600; fill: var(--ink); }
		.t-m { font-family: var(--mono); font-size: 10.5px; fill: var(--ink-2); }
		.t-dim { fill: var(--ink-3); }
		.c-out { fill: var(--out); }
		.c-back { fill: var(--back); }
		.c-ctl { fill: var(--ctl); }
		.mid { text-anchor: middle; }
		.end { text-anchor: end; }
		.l-life { stroke: var(--rule); stroke-width: 1.5; fill: none; stroke-dasharray: 6 5; }
		.l-ret { stroke: var(--ctl); stroke-width: 1.4; fill: none; stroke-dasharray: 5 4; }
		.l-ret-ink { stroke: var(--ink-3); stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
		.note { fill: var(--panel); stroke: var(--rule); }
		.bar-old-out { fill: var(--out-bg); stroke: var(--out); stroke-width: 1.2; stroke-dasharray: 4 3; }
		.bar-new-out { fill: var(--out); }
		.bar-old-back { fill: var(--back-bg); stroke: var(--back); stroke-width: 1.2; stroke-dasharray: 4 3; }
		.bar-new-back { fill: var(--back); }
		.t-inv { fill: var(--surface); }
	</style>

	<defs>
		<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L10 5 L0 10 z" class="mk-ink"/>
		</marker>
		<marker id="arr-ctl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L10 5 L0 10 z" class="mk-ctl"/>
		</marker>
		<marker id="arr-out" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L10 5 L0 10 z" class="mk-out"/>
		</marker>
		<marker id="arr-back" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
			<path d="M0 0 L10 5 L0 10 z" class="mk-back"/>
		</marker>
	</defs>

	<rect class="ground" x="0" y="0" width="1400" height="1010"/>

	<text class="t-title" x="40" y="48">A host joins a VNI group</text>
	<text class="t-sub" x="40" y="72">the server orders and batches, the committer commits, everybody follows the same log · example: client B subscribes to VNI 100, which A already created</text>
	<rect class="box-ctl" x="100" y="100" width="320" height="50" rx="6"/>
	<text class="t-h mid" x="260" y="122">client A</text>
	<text class="t-m t-dim mid" x="260" y="140">committer: oldest member with a stream</text>
	<path class="l-life" d="M260 150 V760"/>
	<rect class="fill-ctl" x="540" y="100" width="320" height="50" rx="6"/>
	<text class="t-h mid" x="700" y="122">mlsbond-server</text>
	<text class="t-m t-dim mid" x="700" y="140">Delivery Service of VNI 100</text>
	<path class="l-life" d="M700 150 V760"/>
	<rect class="box-ctl" x="980" y="100" width="320" height="50" rx="6"/>
	<text class="t-h mid" x="1140" y="122">client B</text>
	<text class="t-m t-dim mid" x="1140" y="140">subscribes to VNI 100</text>
	<path class="l-life" d="M1140 150 V760"/>

	<!-- hello and key packages -->
	<path class="l-ink" d="M1140 190 H700" marker-end="url(#arr)"/>
	<text class="t-m mid" x="920.0" y="183">Hello{host prefix, instance, last boot ID}</text>
	<path class="l-ink" d="M700 228 H1140" marker-end="url(#arr)"/>
	<text class="t-m mid" x="920.0" y="221">HelloAck{boot ID, key packages still held}</text>
	<path class="l-ctl" d="M1140 266 H700" marker-end="url(#arr-ctl)"/>
	<text class="t-m c-ctl mid" x="920.0" y="259">KeyPackages[…]   topped up to --key-packages (8)</text>
	<path class="l-ink" d="M1140 304 H700" marker-end="url(#arr)"/>
	<text class="t-m mid" x="920.0" y="297">Join{vni 100}</text>

	<!-- batching -->
	<rect class="note" x="510.0" y="320" width="380" height="48" rx="5"/>
	<text class="t-m mid" x="700" y="339">waits --commit-delay-ms (200 ms) to bundle</text>
	<text class="t-m mid" x="700" y="356">pending joins, removals and rekeys</text>

	<!-- commit -->
	<path class="l-ctl" d="M700 410 H260" marker-end="url(#arr-ctl)"/>
	<text class="t-m c-ctl mid" x="480.0" y="403">CommitWork{epoch e, adds [B's key package], removes, scope}</text>
	<rect class="note" x="70.0" y="428" width="380" height="65" rx="5"/>
	<text class="t-m mid" x="260" y="447">one MLS commit: add B, with a path update;</text>
	<text class="t-m mid" x="260" y="464">the Scope rides in its authenticated data;</text>
	<text class="t-m mid" x="260" y="481">kept pending until it comes back</text>
	<path class="l-ctl" d="M260 524 H700" marker-end="url(#arr-ctl)"/>
	<text class="t-m c-ctl mid" x="480.0" y="517">Commit{commit, Welcome}</text>
	<rect class="note" x="510.0" y="542" width="380" height="31" rx="5"/>
	<text class="t-m mid" x="700" y="561">appended to the log of VNI 100 as seq n</text>

	<!-- fan-out -->
	<path class="l-ctl" d="M700 620 H260" marker-end="url(#arr-ctl)"/>
	<text class="t-m c-ctl mid" x="480.0" y="613">Entry{seq n, commit}   to every member</text>
	<path class="l-ctl" d="M700 620 H1140" marker-end="url(#arr-ctl)"/>
	<text class="t-m c-ctl mid" x="920.0" y="613">Welcomed{seq n, Welcome}</text>
	<text class="t-m t-dim end" x="248" y="646">merges its pending commit: epoch e+1</text>
	<text class="t-m t-dim" x="1152" y="646">joins from the Welcome: epoch e+1</text>

	<!-- acks -->
	<path class="l-ink" d="M260 690 H700" marker-end="url(#arr)"/>
	<text class="t-m mid" x="480.0" y="683">Ack{seq n}</text>
	<path class="l-ink" d="M1140 690 H700" marker-end="url(#arr)"/>
	<text class="t-m mid" x="920.0" y="683">Ack{seq n}</text>
	<rect class="note" x="510.0" y="708" width="380" height="31" rx="5"/>
	<text class="t-m mid" x="700" y="727">drops seq n once every member acked it</text>

	<!-- outcome -->
	<rect class="fill-out" x="60" y="780" width="1280" height="52" rx="6"/>
	<text class="t-m mid" x="700" y="802">Pair A–B is new in epoch e+1: A and B derive its Security Associations and take the steps in rekey.svg.</text>
	<text class="t-m mid" x="700" y="820">A's pairs with other members keep their epoch: a join rekeys nothing (ADR 0007).</text>

	<!-- insets -->
	<rect class="panel" x="40" y="856" width="420" height="130" rx="8"/>
	<text class="t-h" x="56" y="880">First subscriber of a VNI</text>
	<text class="t-m" x="56" y="904">server → CreateGroup{vni}</text>
	<text class="t-m" x="56" y="922">the client creates the MLS group at epoch 0</text>
	<text class="t-m" x="56" y="940">client → GroupCreated{vni}: committer from now</text>
	<text class="t-m" x="56" y="958">others who joined meanwhile wait for it</text>
	<rect class="panel" x="490" y="856" width="420" height="130" rx="8"/>
	<text class="t-h" x="506" y="880">Committer goes away</text>
	<text class="t-m" x="506" y="904">the next commit goes to the oldest member</text>
	<text class="t-m" x="506" y="922">that still has a stream; unanswered work</text>
	<text class="t-m" x="506" y="940">moves with it. A member gone longer than</text>
	<text class="t-m" x="506" y="958">--removal-grace (10 s) is removed by commit</text>
	<rect class="panel" x="940" y="856" width="420" height="130" rx="8"/>
	<text class="t-h" x="956" y="880">Reliable delivery</text>
	<text class="t-m" x="956" y="904">entries are numbered per VNI group and acked</text>
	<text class="t-m" x="956" y="922">a reconnect sends Resume{vni, last seq}</text>
	<text class="t-m" x="956" y="940">Ready, Switched, proposals: resent until Accepted</text>
	<text class="t-m" x="956" y="958">Rejoin when the log no longer reaches back</text>
</svg>
